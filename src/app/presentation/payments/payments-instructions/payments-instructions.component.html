<i class="pi pi-shopping-bag page-icon"></i>

<app-table #table dataKey="tblAllRequests" [service]="service" [columns]="columns" [actionItems]="actionItems"
    [searchObject]="searchObject" [showFooter]="true" [summaryColumns]="summaryColumns"></app-table>

<p-dialog [header]="'details' | translate" [modal]="true" [(visible)]="visibleDetails" [style]="{ width: '60rem' }"
    styleClass="form-modal">
    <p-table [value]="selectedOrderItems || []">
        <ng-template pTemplate="header">
            <tr>
                <th>Ürün Tanımı</th>
                <th>Birim Fiyat</th>
                <th>Miktar</th>
                <th class="text-right">Toplam Tutar</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item?.productDefinition }}</td>
                <td>{{ item?.unitPrice | currency:'TRY' }}</td>
                <td>{{ item?.quantity }}</td>
                <td class="text-right">{{ item?.totalPrice | currency:'TRY' }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="footer">
            <tr>
                <td colspan="4" class="text-right"><strong>{{ getTotalPrice() | currency:'TRY' }}</strong></td>
            </tr>
        </ng-template>
    </p-table>
</p-dialog>
